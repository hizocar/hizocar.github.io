project:
  type: website
  output-dir : docs
  resources:
    - assets/
    - images/

website:
  title: "Sebastián Azócar"
  description: "Data scientist en LATAM Airlines y profesor de machine learning, econometría e IA en la USM."
  site-url: https://hizocar.github.io
  favicon: '/images/logo.png'
  image: '/images/logo.png'
  open-graph: true
  twitter-card: true
  reader-mode: true
  navbar:
    title: false
    logo: /images/logo.png
    logo-alt: "Inicio"
    tools:
      - icon: github
        href: https://github.com/hizocar
    left:
      - text: "Inicio"
        file: index.qmd
      - text: "Cursos"
        file: cursos.qmd
      - text: "Contacto"
        href: index.html#contacto

  sidebar:
   - id: Courses
     style: "docked"
     search: true
     contents:
      - machine_learning_egei/classes.qmd
      - introduction_to_python/classes.qmd
      - machine_learning_ICO_USM/classes.qmd
format:
  html:
    theme:
          light: [cosmo, theme-light.scss]
          dark: [cosmo, theme-dark.scss]
    css: styles.css
    include-in-header: _includes/head.html
    toc: true
